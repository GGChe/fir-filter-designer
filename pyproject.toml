[project]
name = "firdesigner"
version = "0.1.0"
description = "Design, run sample by sample, and analyse FIR filters"
authors = [{ name = "Gabriel Galeote Checa", email = "gabriel@imse-cnm.csic.es" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
fir-design = "firdesigner.cli:main"

[tool.poetry]
packages = [{ include = "firdesigner" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
